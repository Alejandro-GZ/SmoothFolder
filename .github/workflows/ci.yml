name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SmoothFolder.csproj

      - name: Build
        run: dotnet build SmoothFolder.csproj -c Release --no-restore

      - name: Restore win-x64 publish target
        run: dotnet restore SmoothFolder.csproj -r win-x64

      - name: Publish smoke test
        run: >
          dotnet publish SmoothFolder.csproj
          -c Release
          -r win-x64
          --self-contained false
          --no-restore
          -p:PublishSingleFile=true
          -o artifacts/publish-smoke
